[package]
name = "rb-platform-windows"
description = "RemoteBridge platform adapters for Windows 11."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rb-core = { path = "../../core" }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
sha2 = "0.11.0"
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
base64 = "0.23.1"
p256 = { version = "0.14.0", features = ["ecdsa"] }
