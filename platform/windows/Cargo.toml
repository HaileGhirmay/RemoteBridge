[package]
name = "rb-platform-windows"
description = "RemoteBridge platform adapters for Windows 11."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rb-core = { path = "../../core" }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
sha2 = "0.11.0"
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_DataExchange", "Win32_System_Memory"] }

[dev-dependencies]
base64 = "0.23.1"
p256 = { version = "0.14.0", features = ["ecdsa"] }
