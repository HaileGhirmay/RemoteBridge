[package]
name = "rb-core"
description = "RemoteBridge host core: protocol, sessions, consent and indicator logic. No platform code."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Fake platform implementations, for unit tests in this and other crates.
fakes = []

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.53.2", features = ["time", "rt", "macros"] }

[dev-dependencies]
p256 = { version = "0.14.0", features = ["ecdsa"] }
