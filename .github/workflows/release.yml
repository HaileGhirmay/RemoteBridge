name: Release

# Builds the Windows host and attaches it to the GitHub release for a tag
# (v1.2.3). Run it by hand (workflow_dispatch) to get the zip as a workflow
# artifact without making a release.
#
# Signing happens only when the repository has the two secrets below; until
# then the exe is unsigned and SmartScreen will warn on first run.
#   CODESIGN_PFX_BASE64     the .pfx, base64-encoded
#   CODESIGN_PFX_PASSWORD   its password

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-host:
    name: Windows host (rb-host.exe)
    runs-on: windows-latest
    env:
      # `secrets` cannot be used in a step's `if`, so decide here.
      HAVE_CERT: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p rb-host-app -p rb-native-host

      - name: Sign
        if: env.HAVE_CERT == 'true'
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          & $signtool sign /f $pfx /p $env:CODESIGN_PFX_PASSWORD /fd sha256 `
            /tr http://timestamp.digicert.com /td sha256 `
            target\release\rb-host.exe target\release\rb-native-host.exe
          Remove-Item $pfx

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'dev-' + $env:GITHUB_SHA.Substring(0, 7) }
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target\release\rb-host.exe, target\release\rb-native-host.exe, tools\install-native-host.ps1 -Destination dist
          @"
          RemoteBridge host for Windows 11 ($version)

          1. Put this folder somewhere permanent, for example
             %LOCALAPPDATA%\RemoteBridge.
          2. Sign in at https://remotebridge.floot.app, open My devices and
             register a device to get an 8-digit code, then in PowerShell:
                 .\rb-host.exe enroll <code>
          3. Start the host:        .\rb-host.exe run
             It runs from the tray icon. Right-click it for Share this computer,
             the unattended switch, and Quit.
          4. Start at login:        .\rb-host.exe autostart on
          Logs: %LOCALAPPDATA%\RemoteBridge\logs\rb-host.log
          "@ | Set-Content -Path dist\README.txt
          Compress-Archive -Path dist\* -DestinationPath "remotebridge-host-windows-$version.zip"
          "ZIP=remotebridge-host-windows-$version.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotebridge-host-windows
          path: ${{ env.ZIP }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
