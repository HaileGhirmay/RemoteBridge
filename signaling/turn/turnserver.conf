# coturn configuration for RemoteBridge.
#
# Credentials use the coturn REST scheme (use-auth-secret):
#   username   = "<expiryUnix>:<sessionId>"
#   credential = base64(HMAC-SHA1(TURN_SHARED_SECRET, username))
# The website mints them; the same secret is given to coturn on the command
# line (--static-auth-secret=...), never written into this file.
#
# Replace turn.example.com and the certificate paths, or run with
# docker-compose.yml next to this file.

realm=remotebridge
use-auth-secret
# static-auth-secret=<set with --static-auth-secret=$TURN_SHARED_SECRET>

# Ports: UDP/TCP 3478 (plain), TLS 5349 (also published as 443 by docker-compose).
listening-port=3478
tls-listening-port=5349

# Relay range. Open this UDP range in the firewall.
min-port=49152
max-port=65535

# Needed behind NAT / a cloud one-to-one NAT: public-ip/private-ip.
# external-ip=203.0.113.10/10.0.0.4

cert=/etc/coturn/tls/fullchain.pem
pkey=/etc/coturn/tls/privkey.pem
no-tlsv1
no-tlsv1_1

fingerprint
stale-nonce=600
no-cli
no-multicast-peers
no-software-attribute

# Never relay to private, loopback, link-local or otherwise internal addresses.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limits. total-quota: concurrent allocations on this server.
# user-quota: allocations per credential. bps-capacity: total bytes/s for the
# whole server (about 800 Mbit/s here). max-bps: bytes/s per allocation
# (about 100 Mbit/s). Tune to the VM.
total-quota=100
user-quota=4
bps-capacity=100000000
max-bps=12500000

# Media is end-to-end encrypted (DTLS-SRTP); TURN only sees addresses.
# Keep logs short and out of files.
simple-log
log-file=stdout
